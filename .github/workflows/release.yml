name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: paws-agent-chrome-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag on the main branch
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm verify
      - run: pnpm test:e2e
      - run: pnpm test:e2e:mv3
      - run: pnpm test:production:https
      - name: Package release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm run package:release -- --tag "$RELEASE_TAG"
      - name: Verify release checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cd release-artifacts && sha256sum --check "paws-agent-chrome-${RELEASE_TAG}.sha256"
      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paws-agent-chrome-${{ github.ref_name }}
          path: |
            release-artifacts/paws-agent-chrome-${{ github.ref_name }}.zip
            release-artifacts/paws-agent-chrome-${{ github.ref_name }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-artifacts
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "paws-agent-chrome-${RELEASE_TAG}" \
            --dir release-artifacts
      - name: Verify downloaded checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: cd release-artifacts && sha256sum --check "paws-agent-chrome-${RELEASE_TAG}.sha256"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ZIP_PATH="release-artifacts/paws-agent-chrome-${RELEASE_TAG}.zip"
          CHECKSUM_PATH="release-artifacts/paws-agent-chrome-${RELEASE_TAG}.sha256"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ZIP_PATH" "$CHECKSUM_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "$ZIP_PATH" "$CHECKSUM_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
